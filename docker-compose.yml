# 本地开发用外部依赖：Neo4j 图数据库（图谱功能必需）
# 用法：docker compose up -d neo4j
# 说明：PostgreSQL / Redis 使用 homebrew（见 scripts/start_dev.sh），Milvus 见 docker-compose.milvus.yml
services:
  neo4j:
    image: neo4j:5.26.0
    container_name: juben-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/juben_neo4j_123
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  neo4j_data:
