# 竖屏短剧策划助手配置文件

# 模型配置
models:
  default_provider: "deepseek"  # 默认模型提供商（便宜主力）
  providers:
    # DeepSeek — 默认（deepseek-flash 最便宜）
    deepseek:
      enabled: true
      api_key: "${DEEPSEEK_API_KEY}"
      base_url: "https://api.deepseek.com"
      model: "deepseek-flash"
      temperature: 0.7
      max_tokens: 4096
      available_models:
        - name: "deepseek-flash"
          display_name: "DeepSeek Flash（推荐·便宜）"
          type: "text"
          description: "V4.1 Flash，日常创作与工具调用默认"
          max_tokens: 1000000
          default: true
        - name: "deepseek-v4-pro"
          display_name: "DeepSeek V4 Pro"
          type: "text"
          description: "更强推理，成本更高，按需使用"
          max_tokens: 1000000
      model_mapping:
        default: "deepseek-flash"
        cheapest: "deepseek-flash"
        latest: "deepseek-flash"
        reasoning: "deepseek-v4-pro"
        vision: "deepseek-flash"

    # 智谱AI（可选备用）
    zhipu:
      enabled: false
      api_key: "${ZHIPU_API_KEY}"
      base_url: "https://open.bigmodel.cn/api/paas/v4"
      model: "deepseek-flash"
      temperature: 0.7
      max_tokens: 4096
      available_models:
        - name: "deepseek-flash"
          display_name: "GLM-4.7-Flash"
          type: "text"
          description: "智谱快速文本"
          max_tokens: 128000
      model_mapping:
        default: "deepseek-flash"
        reasoning: "deepseek-v4-pro"

    # OpenRouter (备用)
    openrouter:
      enabled: true
      api_key: "${OPENROUTER_API_KEY}"
      model: "meta-llama/llama-3.3-70b-instruct"
      base_url: "https://openrouter.ai/api/v1"
      temperature: 0.7
      max_tokens: 4096

    # OpenAI (可选，付费)
    openai:
      enabled: false
      api_key: "${OPENAI_API_KEY}"
      model: "gpt-4o"
      base_url: "https://api.openai.com/v1"
      temperature: 0.7
      max_tokens: 4096

# Agent专用模型配置
agent_models:
  # 编排器使用最新最快模型
  orchestrator:
    model: "deepseek-flash"
    temperature: 0.5

  # 接待员使用快速模型
  concierge:
    model: "deepseek-flash"
    temperature: 0.4

  # 知识查询使用思考模型
  knowledge:
    model: "deepseek-v4-pro"
    temperature: 0.3

  # 创作使用最新模型
  creation:
    model: "deepseek-flash"
    temperature: 0.6

  # 评估使用思考模型
  evaluation:
    model: "deepseek-v4-pro"
    temperature: 0.2

  # 视觉相关（DeepSeek Flash 支持 vision）
  vision:
    model: "deepseek-flash"
    temperature: 0.4

# 搜索配置
search:
  enabled: true
  auto_search: true
  confidence_threshold: 0.5
  provider: deepseek
  provider: deepseek

# 知识库配置
knowledge_base:
  enabled: true
  auto_search: true
  confidence_threshold: 0.5

  collections:
    script_segments:
      name: "script_segments_collection"
      description: "剧本桥段库"
      dimension: 768
      metric_type: "COSINE"
      top_k: 5
      score_threshold: 0.7

    drama_highlights:
      name: "drama_highlights_collection"
      description: "短剧高能情节库"
      dimension: 768
      metric_type: "COSINE"
      top_k: 5
      score_threshold: 0.7

# 意图识别配置
intent_recognition:
  enabled: true
  confidence_threshold: 0.3
  patterns:
    web_search:
      keywords: ["最新", "热门", "趋势", "市场", "竞品", "分析", "数据", "统计", "报告", "新闻", "资讯"]
      patterns: ["最新.*?信息", "市场.*?分析", "竞品.*?对比", "行业.*?趋势", "数据.*?统计"]

    knowledge_base:
      keywords: ["桥段", "情节", "套路", "模板", "技巧", "方法", "创作", "写作", "剧本", "故事", "人物", "对话"]
      patterns: ["创作.*?技巧", "写作.*?方法", "剧本.*?结构", "人物.*?塑造", "情节.*?设计"]

    url_extraction:
      keywords: ["链接", "网址", "文档", "文件", "资料"]
      patterns: ["https?://[^\\s]+", "www\\.[^\\s]+", "\\.pdf", "\\.doc", "\\.docx", "\\.txt"]

    creation_assistance:
      keywords: ["策划", "创作", "写作", "剧本", "故事", "人物", "情节", "对话", "大纲", "结构", "主题", "风格", "类型", "题材", "设定"]
      patterns: ["帮我.*?创作", "如何.*?写", "怎么.*?策划", "创作.*?建议"]

    image_generation:
      keywords: ["图片", "图像", "生成图", "海报", "封面"]
      patterns: ["生成.*?图片", "创建.*?图像", "设计.*?海报"]
      model: "cogview-3-flash"

    video_generation:
      keywords: ["视频", "短片", "动画", "生成视频"]
      patterns: ["生成.*?视频", "制作.*?短片"]
      model: "cogvideox-flash"

# 竖屏短剧策划配置
drama_planning:
  # 系统提示词配置
  system_prompt:
    enabled: true
    version: "1.0"

  # 工作流程配置
  workflow:
    auto_intent_recognition: true
    auto_web_search: true
    auto_knowledge_search: true
    auto_url_extraction: true

  # 输出配置
  output:
    include_references: true
    include_sources: true
    max_response_length: 8192
    stream_chunk_size: 100

# 日志配置
logging:
  level: "INFO"
  log_requests: true
  log_responses: false
  log_errors: true

# 性能配置
performance:
  timeout: 30
  max_retries: 3
  connection_pool_size: 10
  enable_caching: true
  cache_ttl: 3600

# Prompt Cache（对照 OpenClaw / Pi）
# - stable prefix：system 规则 / static hooks / 排序后的 tools
# - dynamic suffix：memory 召回 / runtime / dynamic hooks
# - compaction：保留 recent tail，摘要不改写稳定前缀
# - pruning cache-ttl：仅 TTL 过期后修剪旧 tool results
prompt_cache:
  enabled: true
  cache_retention: "short"  # none | short | long
  supports_prompt_cache_key: true
  cache_control_format: null  # null | anthropic
  tool_result_max_chars: 8000
  pruning_mode: "cache-ttl"  # off | always | cache-ttl
  pruning_ttl_seconds: 3600
  keep_recent_messages: 12
  compact_threshold_chars: 24000
  auto_compact: true  # run_tool_loop 每步预判式压缩（仅当超过 compact_threshold_chars 触发）

# 免费模型使用统计
free_model_stats:
  track_usage: true
  log_requests: true
  models:
    - "deepseek-flash"
    - "deepseek-flash"
    - "glm-4.6v-flash"
    - "deepseek-v4-pro"
    - "deepseek-flash-250414"
    - "glm-4v-flash"
    - "cogview-3-flash"
    - "cogvideox-flash"
